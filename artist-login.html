<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Artist Login | MusicBusiness Arena</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="site-page-body artist-auth-body">
    <header class="site-header">
      <a class="brand" href="/home" aria-label="MusicBusiness Arena home">
        <img data-logo src="Mba Logos/MusicBusiness Logo.png" alt="MusicBusiness Arena logo" />
      </a>
      <nav class="site-nav" aria-label="Main navigation">
        <a href="/home">Home</a>
        <a href="/music">Music</a>
        <a href="/video">Video</a>
        <a href="/upload">Upload</a>
      </nav>
    </header>
    <main class="artist-auth-main">
      <section class="artist-auth-card">
        <p class="eyebrow">Artist login</p>
        <h1>Login to Upload</h1>
        <p class="auth-support" data-selected-upload-copy></p>
        <form class="artist-auth-form" data-auth-form="login" autocomplete="on">
          <label>Email Address<input name="artistEmail" type="email" autocomplete="section-artist username" required /></label>
          <label>Password<input name="artistPassword" type="password" autocomplete="section-artist current-password" required /></label>
          <button class="primary-button" type="submit">Login</button>
        </form>
        <p class="form-message" data-auth-message role="status"></p>
        <p class="auth-footnote"><a data-forgot-link href="/artist-forgot-password">Forgot password?</a></p>
        <p class="auth-footnote">New artist? <a data-register-link href="/artist-register">Create Artist Account</a></p>
      </section>
    </main>
    <script src="artist-auth.js"></script>
  </body>
</html>
