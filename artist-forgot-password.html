<!-- ==================================================
     ARTIST FORGOT PASSWORD PAGE

     CODE OWNER GUIDE

     Lets artists request a password reset email.
     Used by: /artist-forgot-password.
     Does not affect Store Manager passwords.
================================================== -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password | MusicBusiness Arena</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="site-page-body artist-auth-body">
    <header class="site-header">
      <a class="brand" href="/home" aria-label="MusicBusiness Arena home">
        <img data-logo src="Mba Logos/MusicBusiness Logo.png" alt="MusicBusiness Arena logo" />
      </a>
    </header>
    <main class="artist-auth-main">
      <section class="artist-auth-card">
        <p class="eyebrow">Account recovery</p>
        <h1>Reset Password</h1>
        <p class="auth-support">Enter your artist account email. We will send a secure reset link.</p>
        <form class="artist-auth-form" data-auth-form="forgot">
          <label>Email Address<input name="email" type="email" autocomplete="email" required /></label>
          <button class="primary-button" type="submit">Send Reset Link</button>
        </form>
        <p class="form-message" data-auth-message role="status"></p>
        <p class="auth-footnote"><a data-login-link href="/artist-login">Back to login</a></p>
      </section>
    </main>
    <script src="artist-auth.js"></script>
  </body>
</html>
