<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Store Manager Password | MusicBusiness Arena</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="manager-login-body">
    <main class="manager-login-shell">
      <section class="manager-login-panel" aria-labelledby="managerResetTitle">
        <img class="manager-login-logo" src="Mba Logos/MusicBusiness Logo.png" alt="MusicBusiness Arena logo" />
        <p class="eyebrow">Account recovery</p>
        <h1 id="managerResetTitle">Create New Password</h1>

        <form class="manager-login-form" data-manager-auth-form="reset">
          <label>
            New Password
            <input name="password" type="password" autocomplete="new-password" minlength="8" required />
          </label>
          <label>
            Confirm Password
            <input name="confirmPassword" type="password" autocomplete="new-password" minlength="8" required />
          </label>
          <button class="primary-button" type="submit">Save New Password</button>
          <p class="form-message" data-manager-auth-message role="status"></p>
        </form>

        <a class="manager-login-home" href="/store-manager-login">Back to Store Manager login</a>
      </section>
    </main>

    <script src="store-manager-auth.js"></script>
  </body>
</html>
