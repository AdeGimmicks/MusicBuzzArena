<!-- ==================================================
     STORE MANAGER FORGOT PASSWORD PAGE

     CODE OWNER GUIDE

     Lets Store Managers request a password reset email.
     Used by: /store-manager-forgot-password.
     Does not affect artist passwords.
================================================== -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Store Manager Password | MusicBusiness Arena</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="manager-login-body">
    <main class="manager-login-shell">
      <section class="manager-login-panel" aria-labelledby="managerForgotTitle">
        <img class="manager-login-logo" src="Mba Logos/MusicBusiness Logo.png" alt="MusicBusiness Arena logo" />
        <p class="eyebrow">Account recovery</p>
        <h1 id="managerForgotTitle">Reset Password</h1>
        <p class="manager-login-copy">Enter the Store Manager email address. A secure reset link will be sent if the account exists.</p>

        <form class="manager-login-form" data-manager-auth-form="forgot">
          <label>
            Email Address
            <input name="email" type="email" autocomplete="email" required />
          </label>
          <button class="primary-button" type="submit">Send Reset Link</button>
          <p class="form-message" data-manager-auth-message role="status"></p>
        </form>

        <a class="manager-login-home" href="/store-manager-login">Back to Store Manager login</a>
      </section>
    </main>

    <script src="store-manager-auth.js"></script>
  </body>
</html>
