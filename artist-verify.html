     ARTIST EMAIL VERIFICATION PAGE

     CODE OWNER GUIDE

     Confirms artist email addresses after registration.
     Used by: /artist-verify.

================================================== -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="Mba Logos/MBA Favicon.png" type="image/png" />
    <title>Verify Artist Account | MusicBusiness Arena</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="site-page-body artist-auth-body">
    <header class="site-header">
      <a class="brand" aria-label="MusicBusiness Arena home">
        <img data-logo src="Mba Logos/MusicBusiness Logo.png" alt="MusicBusiness Arena logo" />
      </a>
    </header>
    <main class="artist-auth-main">
      <section class="artist-auth-card">
        <p class="eyebrow">Email verification</p>
        <h1>Verify Artist Account</h1>
        <p class="auth-support">We are verifying your artist email address.</p>
        <p class="form-message" data-auth-message role="status">Checking verification link...</p>
        <div class="auth-actions">
          <a class="primary-button" data-login-link href="/artist-login">Continue to Login</a>
        </div>
      </section>
    </main>
    <script src="artist-auth.js"></script>
  </body>
</html>
