<!-- ==================================================
     STORE MANAGER LOGIN PAGE

     CODE OWNER GUIDE

     Lets the platform owner/admin log into the Store Manager Dashboard.
     Used by: /store-manager-login.
     Does not log in artist accounts.
================================================== -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="Mba Logos/MBA Favicon.png" type="image/png" />
    <title>Store Manager Login | MusicBusiness Arena</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="manager-login-body">
    <!-- ==================================================
         STORE MANAGER LOGIN FORM

         Lets the website owner/admin sign into the Store Manager.

         This login is separate from Artist Login and should only
         authenticate Store Manager accounts.
    ================================================== -->
    <main class="manager-login-shell">
      <section class="manager-login-panel" aria-labelledby="managerLoginTitle">
        <img class="manager-login-logo" src="Mba Logos/MusicBusiness Logo.png" alt="MusicBusiness Arena logo" />
        <p class="eyebrow">Secure admin access</p>
        <h1 id="managerLoginTitle">Store Manager</h1>
        <p class="manager-login-copy">
          Sign in to approve releases, manage artist pages, review records, and update platform settings.
        </p>

        <form id="storeManagerLoginForm" class="manager-login-form" autocomplete="on">
          <label>
            Email Address
            <input name="storeManagerEmail" type="email" autocomplete="section-store-manager username" required />
          </label>
          <label>
            Password
            <input name="storeManagerPassword" type="password" autocomplete="section-store-manager current-password" required />
          </label>
          <button class="primary-button" type="submit">Unlock Store Manager</button>
          <p class="form-message" id="storeManagerLoginMessage" role="status"></p>
        </form>

        <a class="manager-login-home" href="/store-manager-forgot-password">Forgot password?</a>
        <a class="manager-login-home" href="/home">Return to website</a>
      </section>
    </main>

    <!-- Store Manager login behavior is controlled by store-manager-login.js. -->
    <script src="store-manager-login.js"></script>
  </body>
</html>
