<!-- ==================================================
     ARTIST REGISTRATION PAGE

     CODE OWNER GUIDE

     Lets new artists create an account before uploading.
     Used by: /artist-register.
     Does not create Store Manager accounts.
================================================== -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Artist Account | MusicBusiness Arena</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="site-page-body artist-auth-body">
    <!-- ==================================================
         PUBLIC HEADER

         Shows the website logo and public navigation above the
         Artist Registration form.
    ================================================== -->
    <header class="site-header">
      <a class="brand" href="/home" aria-label="MusicBusiness Arena home">
        <img data-logo src="Mba Logos/MusicBusiness Logo.png" alt="MusicBusiness Arena logo" />
      </a>
      <nav class="site-nav" aria-label="Main navigation">
        <a href="/home">Home</a>
        <a href="/music">Music</a>
        <a href="/video">Video</a>
        <a href="/upload">Upload</a>
      </nav>
    </header>
    <!-- ==================================================
         ARTIST REGISTRATION FORM

         Lets new artists create an account with artist name,
         email, password, and password confirmation.

         This form does not create Store Manager accounts.
    ================================================== -->
    <main class="artist-auth-main">
      <section class="artist-auth-card">
        <p class="eyebrow">Artist account</p>
        <h1>Create Artist Account</h1>
        <p class="auth-support" data-selected-upload-copy></p>
        <form class="artist-auth-form" data-auth-form="register">
          <label>Artist Name<input name="artistName" autocomplete="organization" required /></label>
          <label>Email Address<input name="email" type="email" autocomplete="email" required /></label>
          <label>Password<input name="password" type="password" autocomplete="new-password" minlength="8" required /></label>
          <label>Confirm Password<input name="confirmPassword" type="password" autocomplete="new-password" minlength="8" required /></label>
          <button class="primary-button" type="submit">Create Account</button>
        </form>
        <p class="form-message" data-auth-message role="status"></p>
        <p class="auth-footnote">Already have an account? <a data-login-link href="/artist-login">Login</a></p>
      </section>
    </main>
    <!-- Artist registration behavior is controlled by artist-auth.js. -->
    <script src="artist-auth.js"></script>
  </body>
</html>
