<!-- ==================================================
     ARTIST RESET PASSWORD PAGE

     CODE OWNER GUIDE

     Lets artists set a new password from a secure reset link.
     Used by: /artist-reset-password.
     Does not change release data.
================================================== -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Artist Password | MusicBusiness Arena</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="site-page-body artist-auth-body">
    <header class="site-header">
      <a class="brand" href="/home" aria-label="MusicBusiness Arena home">
        <img data-logo src="Mba Logos/MusicBusiness Logo.png" alt="MusicBusiness Arena logo" />
      </a>
    </header>
    <main class="artist-auth-main">
      <section class="artist-auth-card">
        <p class="eyebrow">Account recovery</p>
        <h1>Create New Password</h1>
        <form class="artist-auth-form" data-auth-form="reset">
          <label>New Password<input name="password" type="password" autocomplete="new-password" minlength="8" required /></label>
          <label>Confirm Password<input name="confirmPassword" type="password" autocomplete="new-password" minlength="8" required /></label>
          <button class="primary-button" type="submit">Save New Password</button>
        </form>
        <p class="form-message" data-auth-message role="status"></p>
      </section>
    </main>
    <script src="artist-auth.js"></script>
  </body>
</html>
